<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woven City Walk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #87ceeb; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
    canvas { display: block; }

    #start-screen {
      position: fixed; inset: 0;
      background: linear-gradient(160deg, #0d3b4f 0%, #1a6b6b 50%, #2e8b57 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 100;
    }
    #start-screen h1 { font-size: 52px; font-weight: 900; letter-spacing: 2px; color: #a8f0e0; text-shadow: 0 2px 20px rgba(0,255,200,0.4); }
    #start-screen .subtitle { font-size: 18px; color: #cee; margin: 10px 0 6px; }
    #start-screen .desc { font-size: 15px; color: #9dc; margin-bottom: 20px; }
    #start-screen button {
      padding: 14px 44px; background: #2a9d8f; color: #fff;
      border: none; border-radius: 30px; font-size: 20px; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 20px rgba(42,157,143,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #start-screen button:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 6px 28px rgba(42,157,143,0.7); }
    #start-screen button:disabled { background: #3a6060; cursor: not-allowed; box-shadow: none; opacity: 0.7; }
    #start-screen .controls { margin-top: 22px; font-size: 13px; color: #8cc; }

    #loading-area { margin-bottom: 22px; width: 280px; }
    #progress-bar-track {
      width: 100%; height: 6px;
      background: rgba(255,255,255,0.15); border-radius: 3px;
      overflow: hidden; margin-bottom: 7px;
    }
    #progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #2a9d8f, #56d8c8);
      border-radius: 3px; transition: width 0.3s ease;
    }
    #progress-text { font-size: 12px; color: #8cc; text-align: center; min-height: 1.4em; }

    #counter {
      position: fixed; top: 18px; right: 20px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(6px);
      padding: 10px 22px; border-radius: 16px;
      font-size: 17px; font-weight: bold; color: #1a5f4a;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    #counter span { color: #2a9d8f; }

    #prompt {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.72); color: #fff; backdrop-filter: blur(4px);
      padding: 10px 28px; border-radius: 24px; font-size: 15px;
      display: none; white-space: nowrap;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

    #robot-name {
      position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
      background: rgba(42,157,143,0.85); color: #fff;
      padding: 6px 18px; border-radius: 14px; font-size: 14px;
      display: none; white-space: nowrap;
    }

    #controls-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #ccc; backdrop-filter: blur(4px);
      padding: 7px 20px; border-radius: 12px; font-size: 12px;
    }

    #goal {
      position: fixed; inset: 0; display: none;
      background: rgba(0,60,40,0.85); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; flex-direction: column;
      z-index: 50;
    }
    #goal.show { display: flex; }
    #goal-box {
      background: #fff; border-radius: 24px; padding: 50px 70px;
      text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.3);
      animation: popIn 0.5s cubic-bezier(.2,1.4,.4,1) both;
    }
    @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
    #goal-box h1 { font-size: 52px; color: #2a9d8f; margin-bottom: 14px; }
    #goal-box p { font-size: 18px; color: #555; margin: 6px 0; }
    #goal-box .restart {
      margin-top: 26px; padding: 12px 36px; background: #2a9d8f; color: #fff;
      border: none; border-radius: 24px; font-size: 18px; cursor: pointer;
    }

    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 16px; height: 16px; pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.7);
    }
    #crosshair::before { width: 2px; height: 100%; left: 7px; top: 0; }
    #crosshair::after  { width: 100%; height: 2px; top: 7px; left: 0; }

    /* ── Chat UI ── */
    #chat-ui {
      position: fixed;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(520px, 96vw);
      background: rgba(10, 30, 40, 0.95);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(42,157,143,0.38);
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      display: none; flex-direction: column;
      z-index: 200;
      max-height: 56vh;
      box-shadow: 0 -6px 36px rgba(0,0,0,0.55);
    }
    #chat-ui.visible { display: flex; }

    #chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 10px;
      border-bottom: 1px solid rgba(42,157,143,0.2);
      flex-shrink: 0;
    }
    #chat-robot-label {
      font-size: 15px; font-weight: bold; color: #a8f0e0;
      display: flex; align-items: center; gap: 8px;
    }
    #chat-robot-dot { width: 10px; height: 10px; border-radius: 50%; background: #2a9d8f; flex-shrink: 0; }
    #chat-close-btn {
      background: rgba(255,255,255,0.08); border: none; color: #999;
      width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; flex-shrink: 0;
    }
    #chat-close-btn:hover { background: rgba(255,70,70,0.3); color: #fff; }

    #chat-messages {
      flex: 1; overflow-y: auto;
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: rgba(42,157,143,0.35); border-radius: 2px; }

    .chat-bubble {
      max-width: 82%; padding: 9px 14px;
      border-radius: 16px; font-size: 14px;
      line-height: 1.55; word-break: break-word;
      border: 1px solid transparent;
    }
    .chat-bubble.robot {
      align-self: flex-start;
      background: rgba(42,157,143,0.2);
      border-color: rgba(42,157,143,0.32);
      color: #ddf5f0;
      border-bottom-left-radius: 4px;
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.16);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-bubble.thinking {
      align-self: flex-start;
      background: rgba(42,157,143,0.07);
      border-color: rgba(42,157,143,0.15);
      color: #6bb; font-style: italic; font-size: 13px;
      border-bottom-left-radius: 4px;
    }

    #chat-input-area {
      display: flex; gap: 8px;
      padding: 10px 12px 14px;
      border-top: 1px solid rgba(42,157,143,0.16);
      flex-shrink: 0;
    }
    #chat-input {
      flex: 1; background: rgba(255,255,255,0.07);
      border: 1px solid rgba(42,157,143,0.28);
      border-radius: 20px; padding: 8px 16px;
      color: #fff; font-size: 14px; outline: none; font-family: inherit;
    }
    #chat-input:focus { border-color: rgba(42,157,143,0.62); }
    #chat-input::placeholder { color: rgba(255,255,255,0.27); }
    #chat-input:disabled { opacity: 0.42; cursor: not-allowed; }
    #chat-send-btn {
      background: #2a9d8f; border: none; color: #fff;
      border-radius: 20px; padding: 8px 20px;
      font-size: 14px; cursor: pointer; font-weight: bold;
      transition: background 0.2s; white-space: nowrap;
    }
    #chat-send-btn:hover:not(:disabled) { background: #36b2a2; }
    #chat-send-btn:disabled { background: #2d4040; cursor: not-allowed; }
  </style>
</head>
<body>
  <!-- Start screen -->
  <div id="start-screen">
    <h1>🌿 Woven City Walk</h1>
    <p class="subtitle">未来都市「Woven City」を歩いてロボットたちと話そう！</p>
    <p class="desc">10体のロボット全員と会話したらゴール！</p>
    <div id="loading-area">
      <div id="progress-bar-track"><div id="progress-bar"></div></div>
      <div id="progress-text">AIをロード中...</div>
    </div>
    <button id="startBtn" disabled>START</button>
    <p class="controls">WASD: 移動 ｜ マウス: 視点 ｜ E: 会話</p>
  </div>

  <!-- HUD -->
  <div id="counter">会話: <span id="greet-count">0</span> / 10</div>
  <div id="robot-name"></div>
  <div id="prompt">🤖 [E] で話しかける</div>
  <div id="controls-hint">WASD: 移動 ｜ マウス: 視点 ｜ E: 会話</div>
  <div id="crosshair"></div>

  <!-- Goal screen -->
  <div id="goal">
    <div id="goal-box">
      <h1>🎉 ゴール！</h1>
      <p>全員のロボットと話せました！</p>
      <p style="color:#2a9d8f;font-weight:bold;margin-top:10px">Woven City の仲間になれました！</p>
      <button class="restart" onclick="location.reload()">もう一度</button>
    </div>
  </div>

  <!-- Chat UI -->
  <div id="chat-ui">
    <div id="chat-header">
      <div id="chat-robot-label">
        <div id="chat-robot-dot"></div>
        <span id="chat-robot-name">ロボット</span>
      </div>
      <button id="chat-close-btn" title="会話を終了 (ESC)">✕</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input id="chat-input" type="text" placeholder="メッセージを入力..." maxlength="100" />
      <button id="chat-send-btn">送信</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="main6.js"></script>
</body>
</html>
